<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="cache-control" content="no-cache"/>
  <title>CALL RABBIT</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
</head>
<body>
  <script>
    // Direct redirect for both mobile and desktop. The iframe wrapper that
    // previously held the desktop view was suppressing target=_blank link
    // clicks (iframe popup blocking) and forcing JS-only navigation
    // workarounds. Using the mobile pattern (plain location.replace) makes
    // links work identically across device classes.
    var isMobile = window.innerWidth < 768 || /Android.*Mobile|iPhone|iPod/i.test(navigator.userAgent);
    var dest = isMobile ? 'callrabbit-mobile-v2.html' : ('callrabbit-v2.html?v=' + Date.now());
    window.location.replace(dest);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=callrabbit-v2.html"/>
  </noscript>
</body>
</html>
